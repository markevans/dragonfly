name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ["2.7", "3.0", "3.1", "3.2", "3.3", "3.4", "4.0", "jruby"]
    env:
      SKIP_FLAKY_TESTS: true
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick and Ghostscript
        run: sudo apt-get update && sudo apt-get install -y imagemagick ghostscript
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rspec spec --backtrace
